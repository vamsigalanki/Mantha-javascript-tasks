

10. Write a program to sort the array of elements in descending order
 <html>
    <head></head>
    <body>
        <script>
            const arr=[32,44,67,88,44,99,21];
            // arr.sort((a,b)=>b-a);
            // console.log(arr);

            
            //by calloing function method in descending order
            function sortdescending(arr){
                return arr.sort((a,b)=>b-a);
            };
            //const sortedArr=sortdescending(arr);
            console.log(sortdescending(arr));
        </script>
