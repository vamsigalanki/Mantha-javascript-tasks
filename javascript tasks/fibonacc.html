<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <script>
            function fib(n){
                let fibn=[0,1];

                for(let i=2;i<n;i++){
                    fibn[i]=fibn[i-1]+fibn[i-2];
                }
                return fibn.slice(0,n);

            }
            console.log(fib(10));
        </script>
    </body>
</html>
