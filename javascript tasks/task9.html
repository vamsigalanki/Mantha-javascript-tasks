<!-- Implement a set of functions that mimic the behavior of a calculator . The
functions should take two numbers as input and perform the following
operations : addition , subtraction , division , multiplication , modulus . -->
<!DOCTYPE html>
<html>
    <head>
        <title>Functions</title>
    </head>
    <body>
        <script>
             add
            function add(a,b){
                return a+b;
            }
             const results=add(10,30);
             console.log(results);
             subtraction
             function sub(a,b){
                 return a-b;
             }
             const resultd=sub(100,30);
             console.log(resultd);
             division
             function division(a,b){
                 return a/b;
             }
             const resultf=division(30,3);
             console.log(resultf);
             multiplication
             function multiplication(a,b){
                 return a*b
             }
             const resultg=multiplication(30,3);
             console.log(resultg);
            modulus
             function modulus(a,b){
            return a%b;
             }
             const result=modulus(30,3);
             console.log(result);
        </script>
    </body>
</html>
